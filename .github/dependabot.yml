version: 2

multi-ecosystem-groups:
  dependencies:
    schedule:
      interval: monthly
    labels: [dependabot]

updates:
  - package-ecosystem: github-actions
    directories: [/]
    patterns: ['*']
    cooldown:
      default-days: 14
    multi-ecosystem-group: dependencies

  - package-ecosystem: gomod
    directories: [/]
    patterns: ['*']
    cooldown:
      default-days: 14
    multi-ecosystem-group: dependencies

  - package-ecosystem: docker
    directories: [/]
    patterns: ['*']
    cooldown:
      default-days: 14
    multi-ecosystem-group: dependencies
